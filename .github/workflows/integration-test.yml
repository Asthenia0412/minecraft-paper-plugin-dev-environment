name: Integration Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./tools/build-and-deploy.sh
      - run: EULA_ACCEPTED=true ./tools/run-test.sh
      - if: always()
        run: ./tools/collect-feedback.sh
